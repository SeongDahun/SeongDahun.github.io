<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile preview (390px)</title>
<style>
  body{margin:0;background:#e7eaf2;font-family:system-ui,sans-serif;display:flex;gap:22px;padding:18px;justify-content:flex-start;align-items:flex-start;flex-wrap:wrap}
  figure{margin:0;text-align:center}
  figcaption{font-size:12px;color:#445;margin-bottom:6px;font-weight:600}
  iframe{width:390px;height:844px;border:0;border-radius:18px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}
</style>
</head>
<body>
  <figure><figcaption>top</figcaption><iframe src="https://seongdahun.github.io/?v=3&lang=ko"></iframe></figure>
  <figure><figcaption>profile card</figcaption><iframe data-sel=".card-profile" src="https://seongdahun.github.io/?v=3&lang=ko"></iframe></figure>
  <figure><figcaption>teach summary</figcaption><iframe data-sel="#teaching .sec-head" src="https://seongdahun.github.io/?v=3&lang=ko"></iframe></figure>
  <figure><figcaption>teaching rows</figcaption><iframe data-sel="#teaching .t-list .t-row:nth-child(7)" src="https://seongdahun.github.io/?v=3&lang=ko"></iframe></figure>
  <figure><figcaption>methods / quotes</figcaption><iframe data-sel="#teaching .methods" src="https://seongdahun.github.io/?v=3&lang=ko"></iframe></figure>
  <figure><figcaption>papers</figcaption><iframe data-sel="#research .papers" src="https://seongdahun.github.io/?v=3&lang=ko"></iframe></figure>
  <figure><figcaption>projects / awards</figcaption><iframe data-sel="#projects .awards" src="https://seongdahun.github.io/?v=3&lang=ko"></iframe></figure>
  <figure><figcaption>contact panel</figcaption><iframe data-sel="#contact .contact" src="https://seongdahun.github.io/?v=3&lang=ko"></iframe></figure>
<script>
window.addEventListener('load', function(){
  document.querySelectorAll('iframe[data-sel]').forEach(function(f){
    var go = function(){
      try{
        var d = f.contentDocument;
        var el = d.querySelector(f.dataset.sel);
        if (el){ d.documentElement.scrollTop = el.getBoundingClientRect().top + d.documentElement.scrollTop - 70; }
      }catch(e){}
    };
    setTimeout(go, 1200);
  });
});
</script>
</body>
</html>
